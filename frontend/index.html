<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Private household spending ledger" />
    <title>Household Ledger</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("household-ledger-theme");
          const theme = saved === "light" || saved === "dark"
            ? saved
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#09090b" : "#ffffff";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
